<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OFF/NA</title>
  <meta name="description" content="OFF/NA — Runway 12.11 fanzine. Every look is clickable: shop each piece from its designer.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="fanzine/fanzine.css">
</head>
<body>
  <header class="bar">
    <span>OFF/NA</span>
    <span class="clock" id="clock">TLV --:--</span>
  </header>

  <!-- The fanzine. Pages + link positions: fanzine/pages.json · brand links: fanzine/brands.js
       To open on a cover first, add data-cover="fanzine/cover.jpg" below. -->
  <main class="fanzine" id="fanzine" data-src="fanzine/" aria-label="OFF/NA Runway 12.11 fanzine">
    <button class="fz-nav fz-prev" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg></button>
    <div class="fz-stage" aria-live="polite"></div>
    <button class="fz-nav fz-next" type="button" aria-label="Next page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg></button>
    <div class="fz-pop" role="dialog" aria-label="Pieces in this look" hidden></div>
  </main>

  <footer class="bar">
    <span class="hint"><span class="hint-long">Click a credit or a look to shop</span><span class="hint-short">Tap to shop</span></span>
    <span class="clock" id="fz-count">-- / --</span>
    <a href="https://www.instagram.com/offnaweek/" target="_blank" rel="noopener">Instagram <svg class="arrow" width="9" height="9" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 9.5 9.5 2.5M3.5 2.5h6v6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg></a>
  </footer>

  <script src="fanzine/brands.js"></script>
  <script src="fanzine/fanzine.js"></script>
  <script src="main.js"></script>
</body>
</html>
