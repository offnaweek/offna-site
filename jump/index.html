  <!-- ───────────────────────────────────────────────────────
       NFC JUMP — where /jump sends people.
       To change the destination, edit ONLY the URL after "url=" below.
       ─────────────────────────────────────────────────────── -->
  <meta http-equiv="refresh" content="0; url=https://www.instagram.com/offnaweek/">

  <script>
    // Same destination, read from the line above; replace() keeps /jump out of the back button
    const target = document.querySelector('meta[http-equiv="refresh"]').content.split("url=")[1];
    location.replace(target);
  </script>
